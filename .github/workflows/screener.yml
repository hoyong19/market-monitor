name: Stock Valuation Screener

on:
  schedule:
    # 10분마다 자동 실행
    - cron: '*/10 * * * *'
  workflow_dispatch: # 언제든 수동 즉시 실행 가능

permissions:
  contents: write # 저장소 쓰기 권한

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: 종목 스크리닝 분석 엔진 가동
        run: python stock_analyzer.py

      - name: 결과 JSON 파일 자동 커밋 및 푸시
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add screener_results.json
          git commit -m "Auto-update: Screener rankings [$(date +'%Y-%m-%d %H:%M')]" || exit 0
          git pull --rebase origin main
          git push origin main
