name: Stock Valuation Screener

on:
  schedule:
    # 매 15분마다 자동 실행 (GitHub Actions 무료 플랜에서 가장 안정적인 주기)
    - cron: '*/15 * * * *'
  workflow_dispatch:  # 필요 시 수동 실행 버튼 유지

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run stock analyzer
        run: |
          python stock_analyzer.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add screener_results.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto update screener & macro data [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi
